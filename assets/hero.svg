<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 250" width="100%" role="img" aria-label="Abhi Virani - Systems Architect &amp; AI Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="100%" stop-color="#0e1726"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#00c6ff"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.6"/>
    </pattern>
    <radialGradient id="spotlight" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.35; transform: scale(0.9); } }
    @keyframes scan { 0% { transform: translateY(0); opacity: 0; } 50% { opacity: 0.8; } 100% { transform: translateY(240px); opacity: 0; } }
    .beacon { animation: pulse 2s ease-in-out infinite; transform-origin: 52px 42px; }
    .scanline { animation: scan 6s linear infinite; }
  </style>

  <!-- Base Card -->
  <rect width="920" height="250" rx="14" fill="url(#bg)" stroke="#1e293b" stroke-width="1.5"/>
  <rect width="920" height="250" rx="14" fill="url(#grid)"/>
  <rect width="920" height="250" rx="14" fill="url(#spotlight)"/>

  <!-- Scanning Light Line -->
  <line class="scanline" x1="20" y1="5" x2="900" y2="5" stroke="url(#cyanGlow)" stroke-width="1.2" stroke-opacity="0.3"/>

  <!-- Status Chip -->
  <rect x="36" y="28" width="220" height="28" rx="14" fill="#091424" stroke="#0ea5e9" stroke-width="1"/>
  <circle class="beacon" cx="52" cy="42" r="4.5" fill="#10b981"/>
  <text class="mono" x="66" y="46" font-size="11" fill="#38bdf8" font-weight="600" letter-spacing="1">SYSTEM : ACTIVE // READY</text>

  <!-- Title & Subtitle -->
  <text class="sans" x="36" y="112" font-size="44" font-weight="800" fill="#f8fafc" letter-spacing="-1">Abhi Virani</text>
  <text class="mono" x="36" y="146" font-size="14.5" font-weight="500" fill="#94a3b8">
    <tspan fill="#00f2fe">SYSTEMS ARCHITECT</tspan> • AGENTIC AI &amp; MULTILINGUAL VOICE PIPELINES • FULL-STACK
  </text>

  <!-- Bottom Interactive Tags -->
  <g transform="translate(36, 178)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="180" height="36" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text class="mono" x="14" y="22" font-size="11.5" fill="#cbd5e1">⚡ Founder @ Zynteq</text>

    <!-- Pill 2 -->
    <rect x="192" y="0" width="210" height="36" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text class="mono" x="206" y="22" font-size="11.5" fill="#cbd5e1">🛠️ Next.js 15 &amp; TypeScript</text>

    <!-- Pill 3 -->
    <rect x="414" y="0" width="210" height="36" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text class="mono" x="428" y="22" font-size="11.5" fill="#cbd5e1">🧠 Voice &amp; Agent Workflows</text>

    <!-- Pill 4 -->
    <rect x="636" y="0" width="210" height="36" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text class="mono" x="650" y="22" font-size="11.5" fill="#38bdf8">📍 Global Remote / India</text>
  </g>
</svg>

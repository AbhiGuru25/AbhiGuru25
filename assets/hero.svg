<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" role="img" aria-label="Abhi Virani — Full-Stack &amp; AI Engineer">
  <style>
    .n{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-weight:800;letter-spacing:-1px}
    .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    @keyframes drift{0%{transform:translate(0,0)}50%{transform:translate(35px,-20px)}100%{transform:translate(0,0)}}
    @keyframes slide{0%{background-position:0% 50%}100%{background-position:200% 50%}}
    @keyframes beat{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.85)}}
    @keyframes fade{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}
    .g1{animation:drift 18s ease-in-out infinite}
    .g2{animation:drift 24s ease-in-out infinite reverse}
    .rule{animation:slide 6s linear infinite;background-size:200% 100%}
    .pip{animation:beat 2.2s ease-in-out infinite;transform-origin:center}
    .l1{animation:fade 1s ease both}
    .l2{animation:fade 1s .18s ease both}
    .l3{animation:fade 1s .36s ease both}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <defs>
    <radialGradient id="a"><stop offset="0" stop-color="#00F2FE" stop-opacity=".32"/><stop offset="1" stop-color="#00F2FE" stop-opacity="0"/></radialGradient>
    <radialGradient id="b"><stop offset="0" stop-color="#7928CA" stop-opacity=".25"/><stop offset="1" stop-color="#7928CA" stop-opacity="0"/></radialGradient>
    <linearGradient id="accent" x1="0" x2="1"><stop offset="0" stop-color="#00F2FE"/><stop offset=".5" stop-color="#4FACFE"/><stop offset="1" stop-color="#7928CA"/></linearGradient>
  </defs>
  <rect width="900" height="240" fill="none"/>
  <ellipse class="g1" cx="240" cy="65" rx="320" ry="160" fill="url(#a)"/>
  <ellipse class="g2" cx="690" cy="180" rx="320" ry="160" fill="url(#b)"/>
  <text class="n l1" x="450" y="96" text-anchor="middle" font-size="56" fill="#f8fafc">Abhi Virani</text>
  <rect class="rule l2" x="320" y="118" width="260" height="3" rx="1.5" fill="url(#accent)"/>
  <g class="l3">
    <circle class="pip" cx="232" cy="158" r="5" fill="#22C55E"/>
    <text class="m" x="450" y="163" text-anchor="middle" font-size="13" fill="#94a3b8">open to AI / Full-Stack roles &#183; 2026-2027 batch &#183; remote or India</text>
  </g>
  <text class="m l3" x="450" y="200" text-anchor="middle" font-size="11" fill="#64748b" letter-spacing="2.4">FULL-STACK &#183; AGENTIC WORKFLOWS &#183; AUTOMATION PIPELINES</text>
</svg>

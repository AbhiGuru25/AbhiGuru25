<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 260" width="100%" role="img" aria-label="Abhi Virani - AI &amp; Full-Stack Engineer">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#06090e"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Subtle Dot Pattern -->
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#334155" fill-opacity="0.4"/>
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    @keyframes pulse-dot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.35; transform: scale(0.85); } }
    @keyframes cursor-blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .status-dot { animation: pulse-dot 2s ease-in-out infinite; transform-origin: 755px 38px; }
    .cursor { animation: cursor-blink 1.1s infinite; }
  </style>

  <!-- Window Frame -->
  <rect width="920" height="260" rx="16" fill="url(#bg)" stroke="#1e293b" stroke-width="1.6"/>
  <rect width="920" height="260" rx="16" fill="url(#grid)"/>

  <!-- Terminal Top Bar -->
  <line x1="0" y1="52" x2="920" y2="52" stroke="#1e293b" stroke-width="1.2"/>
  <circle cx="36" cy="26" r="6" fill="#ef4444" fill-opacity="0.8"/>
  <circle cx="56" cy="26" r="6" fill="#f59e0b" fill-opacity="0.8"/>
  <circle cx="76" cy="26" r="6" fill="#10b981" fill-opacity="0.8"/>
  <text class="mono" x="104" y="30" font-size="12" fill="#64748b">abhi@terminal ~ zsh</text>

  <!-- Live Recruiter Status Pill -->
  <rect x="735" y="20" width="155" height="26" rx="13" fill="#064e3b" stroke="#059669" stroke-width="1"/>
  <circle class="status-dot" cx="750" cy="33" r="4.5" fill="#34d399"/>
  <text class="mono" x="762" y="37" font-size="11" fill="#a7f3d0" font-weight="600">OPEN TO WORK</text>

  <!-- Command Line -->
  <text class="mono" x="36" y="86" font-size="14" fill="#38bdf8">
    <tspan fill="#a855f7">➜</tspan> <tspan fill="#00f2fe">whoami</tspan> --role="AI &amp; Full-Stack Systems Engineer" --mode="Production"
  </text>

  <!-- Name Headline -->
  <text class="sans" x="36" y="146" font-size="48" font-weight="900" fill="#ffffff" letter-spacing="-1">
    Abhi Virani
  </text>

  <!-- Accent Divider -->
  <rect x="36" y="164" width="848" height="2" rx="1" fill="url(#accent)"/>

  <!-- Subtitle / Value Prop -->
  <text class="mono" x="36" y="196" font-size="13.5" fill="#94a3b8">
    BUILDING <tspan fill="#00f2fe">AUTONOMOUS MULTI-AGENT ENGINES</tspan> • <tspan fill="#38bdf8">LOW-LATENCY VOICE TELEPHONY</tspan> • <tspan fill="#a855f7">NEXT.JS 15</tspan>
  </text>

  <!-- Bottom Location & Availability Info -->
  <text class="mono" x="36" y="228" font-size="12" fill="#64748b">
    📍 India / Global Remote &nbsp;|&nbsp; 🎓 Software &amp; AI Engineering &nbsp;|&nbsp; ⚡ Ready to deploy <tspan class="cursor" fill="#00f2fe">█</tspan>
  </text>
</svg>
